<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>米娜游戏铺 · 中文小游戏合集</title>
<script src="shared/seed.js"></script><script src="shared/browser-store.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --rice: #F6EEDC;
    --rice-deep: #EFE3C6;
    --lacquer: #C0432E;
    --lacquer-deep: #93261C;
    --leaf-solid: #3E8259;
    --leaf-deep: #285C3B;
    --citrus: #E8A23A;
    --ink: #2B211B;
    --ink-soft: #6b5c4c;
    --basket: #D8C598;
    --basket-line: #B49E68;
    --card-shadow: 0 18px 40px -14px rgba(43,33,27,0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--rice);
    color: var(--ink);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 100vw;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  body {
    background-image:
      radial-gradient(circle at 8% 10%, rgba(192,67,46,0.06) 0, transparent 40%),
      radial-gradient(circle at 92% 88%, rgba(62,130,89,0.09) 0, transparent 45%);
  }
  /* ---- Modal ---- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(30,22,16,0.62);
    display: none;
    align-items: center; justify-content: center;
    padding: clamp(4px, 1.5vw, 20px);
    padding-top: calc(clamp(4px, 1.5vw, 20px) + env(safe-area-inset-top));
    padding-right: calc(clamp(4px, 1.5vw, 20px) + env(safe-area-inset-right));
    padding-bottom: calc(clamp(4px, 1.5vw, 20px) + env(safe-area-inset-bottom));
    padding-left: calc(clamp(4px, 1.5vw, 20px) + env(safe-area-inset-left));
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    position: relative;
    width: 100%; height: 100%;
    max-width: 1600px; max-height: 98vh; max-height: 98dvh;
    background: var(--rice);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 80px -18px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08);
    animation: modalPop 0.2s ease;
  }
  @keyframes modalPop { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
  .modal-box iframe {
    width: 100%; height: 100%; border: none; display: block; background: #fff;
  }
  .modal-close {
    position: absolute; top: 12px; right: 12px; z-index: 10;
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: rgba(20,14,10,0.7); color: #fff;
    font-size: 20px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
  }
  .modal-close:hover { background: rgba(20,14,10,0.9); }
  .modal-title-pill {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(20,14,10,0.7); color: #fff;
    font-size: 12.5px; font-weight: 800; padding: 7px 14px; border-radius: 999px;
  }
</style>
</head>
<body>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title-pill" id="modalTitle"></div>
    <button class="modal-close" id="modalCloseBtn" type="button" aria-label="关闭">✕</button>
    <iframe id="gameFrame" src="about:blank" title="game"></iframe>
  </div>
</div>

<div class="modal-overlay" id="avatarModalOverlay">
  <div class="modal-box">
    <div class="modal-title-pill">🐾 米娜萌宠 · Avatar Creator</div>
    <button class="modal-close" id="avatarModalCloseBtn" type="button" aria-label="关闭">✕</button>
    <iframe id="avatarFrame" src="about:blank" title="avatar creator"></iframe>
  </div>
</div>

  const GAME = {
    zh: '米娜集市',
    en: 'Mina Market'
  };

  const modalOverlay = document.getElementById('modalOverlay');
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  const modalTitle = document.getElementById('modalTitle');
  const gameFrame = document.getElementById('gameFrame');
  const avatarModalOverlay = document.getElementById('avatarModalOverlay');
  const avatarModalCloseBtn = document.getElementById('avatarModalCloseBtn');
  const avatarFrame = document.getElementById('avatarFrame');

  function decodeGameHtml(b64){
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  function openGame(){
    modalTitle.textContent = GAME.zh + ' · ' + GAME.en;
    gameFrame.removeAttribute('src');
    gameFrame.srcdoc = decodeGameHtml(GAME_HTML_B64);
    modalOverlay.classList.add('open');
  }

  // Closing takes you back to the site's home page — there's no separate
  // "game shop" step to fall back to any more.
  function closeModal(){
    window.location.href = 'index.html';
  }

  modalCloseBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal(); // 点击背景也可以关闭
  });

  // ---- Avatar creator popup (opened by the embedded game via postMessage) ----
  function openAvatarModal(){
    avatarFrame.src = 'avatarCreator.html';
    avatarModalOverlay.classList.add('open');
  }
  function closeAvatarModal(){
    // Pull the cat currently drawn in the popup before tearing it down, so the
    // game can update the player's thumbnail with whatever they just made.
    let avatarDataUrl = null;
    try {
      if (avatarFrame.contentWindow && typeof avatarFrame.contentWindow.getAvatarSnapshot === 'function'){
        avatarDataUrl = avatarFrame.contentWindow.getAvatarSnapshot();
      }
    } catch (e) {}
    avatarModalOverlay.classList.remove('open');
    avatarFrame.src = 'about:blank';
    if (gameFrame.contentWindow){
      gameFrame.contentWindow.postMessage({ type: 'mina:avatarCreatorClosed', avatarDataUrl: avatarDataUrl }, '*');
    }
  }
  avatarModalCloseBtn.addEventListener('click', closeAvatarModal);
  avatarModalOverlay.addEventListener('click', (e) => {
    if (e.target === avatarModalOverlay) closeAvatarModal();
  });
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'mina:openAvatarCreator') openAvatarModal();
    if (e.data && e.data.type === 'mina:avatarPopupCloseRequest') closeAvatarModal();
    if (e.data && e.data.type === 'mina:requestLogout'){
      fetch('/api/auth/logout', { method: 'POST' }).then(() => { location.href = 'index.html'; });
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (avatarModalOverlay.classList.contains('open')) closeAvatarModal();
    else if (modalOverlay.classList.contains('open')) closeModal();
  });

  openGame();
})();
